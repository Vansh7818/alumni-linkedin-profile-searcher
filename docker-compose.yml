version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alumni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumni_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alumni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  alumni-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni-linkedin-searcher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alumni_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      PHANTOMBUSTER_API_KEY: ${PHANTOMBUSTER_API_KEY:-}
      PHANTOMBUSTER_AGENT_ID: ${PHANTOMBUSTER_AGENT_ID:-}
      PHANTOMBUSTER_MOCK_MODE: ${PHANTOMBUSTER_MOCK_MODE:-false}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
