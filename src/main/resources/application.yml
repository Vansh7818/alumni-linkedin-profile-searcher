spring:
  application:
    name: alumni-linkedin-searcher
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: list

# PhantomBuster Configuration
phantombuster:
  api-key: ${PHANTOMBUSTER_API_KEY:}
  agent-id: ${PHANTOMBUSTER_AGENT_ID:}
  base-url: ${PHANTOMBUSTER_BASE_URL:https://api.phantombuster.com/api/v2}
  poll-interval-ms: ${PHANTOMBUSTER_POLL_INTERVAL_MS:3000}
  max-wait-seconds: ${PHANTOMBUSTER_MAX_WAIT_SECONDS:120}
  mock-mode:
    enabled: ${PHANTOMBUSTER_MOCK_MODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
